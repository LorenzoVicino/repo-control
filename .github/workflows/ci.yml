name: CI

on:
  # Unfiltered `push` plus `pull_request` runs the whole matrix twice for every commit on
  # a branch with an open PR. The concurrency group below cannot dedupe them either,
  # because github.ref differs (refs/heads/x vs refs/pull/N/merge). Limiting push to the
  # default branch keeps main covered without doubling every PR.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20.19.0"
          - "22.13.0"
          - "24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Each Node version bundles a different npm, and a lockfile written by one is not
      # always installable by an older one. Corepack pins every job to the npm in
      # package.json's packageManager field, so the lockfile has a single author.
      - name: Use the pinned npm
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

  e2e:
    name: Browser E2E
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Use the pinned npm
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
